name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f js/app.js
          test -f js/config.js
          test -f css/main.css
          test -f supabase/schema.sql
          test -f vercel.json
          echo "Required files OK"

      - name: Validate JSON
        run: |
          python3 -c "import json; json.load(open('vercel.json')); json.load(open('manifest.json')); print('JSON OK')"

      - name: Basic HTML sanity
        run: |
          grep -q "GO TRADE" index.html
          grep -q "terminal.css" index.html || true
          grep -q "security.js" index.html || echo "WARN: security.js not linked yet"

      - name: SQL schema has RLS
        run: |
          grep -q "row level security" supabase/schema.sql
          grep -q "is_admin" supabase/schema.sql
          echo "Schema RLS markers OK"

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "No VERCEL_TOKEN secret — skip deploy"
            exit 0
          fi
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel deploy --prod --token=$VERCEL_TOKEN
