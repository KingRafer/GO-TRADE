<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c1f" />
  <meta name="description" content="GO TRADE — ruang administrasi untuk mengelola akun dan konten platform." />
  <meta name="color-scheme" content="light dark" />
  <title>GO TRADE — Admin Center</title>
  <link rel="icon" type="image/png" href="assets/logo-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="app-body">
  <a class="gt-skip-link" href="#app">Lewati ke konten utama</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi admin">
      <div class="brand">
        <img class="brand-mark" src="assets/logo-icon.png" alt="" width="36" height="36" />
        <div><strong>GO TRADE</strong><span>ADMIN CENTER</span></div>
      </div>
      <div class="workspace-switcher">
        <div class="avatar avatar-lime" id="sideAvatar">A</div>
        <div class="profile-copy"><strong id="sideName">Administrator</strong><span>Administrator</span></div>
      </div>
      <nav class="sidebar-nav" aria-label="Menu administrasi">
        <div class="nav-section-label">WORKSPACE</div>
        <button class="nav-item active" data-view="overview"><span class="nav-icon" data-icon="layoutDashboard"></span>Overview</button>
        <button class="nav-item" data-view="users"><span class="nav-icon" data-icon="users"></span>Members</button>
        <div class="nav-section-label">MANAGEMENT</div>
        <button class="nav-item" data-view="deposits"><span class="nav-icon" data-icon="inbox"></span>Deposit requests <span class="nav-badge" id="depBadge">0</span></button>
        <button class="nav-item" data-view="withdrawals"><span class="nav-icon" data-icon="wallet"></span>Withdrawal requests <span class="nav-badge" id="wdBadge">0</span></button>
        <button class="nav-item" data-view="packages"><span class="nav-icon" data-icon="layers"></span>Packages</button>
        <button class="nav-item" data-view="signals"><span class="nav-icon" data-icon="activity"></span>Signals</button>
        <button class="nav-item" data-view="news"><span class="nav-icon" data-icon="newspaper"></span>News</button>
        <button class="nav-item" data-view="network"><span class="nav-icon" data-icon="gitBranch"></span>Referral network</button>
        <div class="nav-section-label">SYSTEM</div>
        <button class="nav-item" data-view="activity"><span class="nav-icon" data-icon="history"></span>Activity log</button>
        <button class="nav-item" data-view="notify"><span class="nav-icon" data-icon="bell"></span>Notifications</button>
        <button class="nav-item" data-view="settings"><span class="nav-icon" data-icon="settings"></span>Settings</button>
      </nav>
      <div class="sidebar-footer">
        <div class="profile-card">
          <div class="avatar" id="footAvatar">A</div>
          <div class="profile-copy"><strong id="footName">Administrator</strong><span>Admin account</span></div>
        </div>
        <button class="nav-item logout-btn" id="logoutBtn"><span class="nav-icon" data-icon="logOut"></span>Sign out</button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <main class="main-content">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Buka menu admin"><span data-icon="menu"></span></button>
        <div class="breadcrumbs"><span>GO TRADE</span><b>/</b><strong id="breadcrumbCurrent">Overview</strong></div>
        <div class="topbar-actions">
          <span class="live-chip"><span class="status-dot"></span><span id="liveClock">--:--:--</span></span>
          <div class="top-avatar" id="topAvatar">A</div>
        </div>
      </header>
      <div class="page" id="app" tabindex="-1" aria-live="polite">
        <div class="card" style="padding:28px">Memuat Admin Center…</div>
      </div>
    </main>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
  </div>
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="icons.js"></script>
  <script src="auth.js"></script>
  <script src="store.js"></script>
  <script src="admin.js"></script>
</body>
</html>
