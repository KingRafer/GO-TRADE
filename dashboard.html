<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0c1f" />
  <title>GO TRADE — Member Workspace</title>
  <link rel="icon" type="image/png" href="assets/logo-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="app-body">
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img class="brand-mark" src="assets/logo-icon.png" alt="GO TRADE" width="32" height="32" />
        <div>
          <strong>GO TRADE</strong>
          <span>WORKSPACE</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <!-- filled by app.js -->
      </nav>
      <div class="sidebar-foot">
        <div class="profile-card">
          <div class="avatar" id="footAvatar">M</div>
          <div class="profile-copy"><strong id="footName">Member</strong><span id="footStatus">Demo mode</span></div>
        </div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="icon-button mobile-only" id="sidebarToggle" aria-label="Menu"><span data-icon="menu" data-icon-size="20"></span></button>
        <div class="breadcrumb"><span id="breadcrumbCurrent">Dashboard</span></div>
        <div class="topbar-actions">
          <button class="icon-button" id="globalSearchButton" aria-label="Search"><span data-icon="search" data-icon-size="19"></span></button>
          <button class="icon-button" id="notifBell" aria-label="Notifications"><span data-icon="bell" data-icon-size="19"></span><span class="badge-dot" id="notifDot" style="display:none"></span></button>
          <div class="theme-toggle"><button data-theme-btn="light" title="Light mode"><span data-icon="sun" data-icon-size="14"></span></button><button data-theme-btn="dark" title="Dark mode"><span data-icon="moon" data-icon-size="14"></span></button></div>
        </div>
      </header>
      <div class="view" id="viewRoot"></div>
    </main>
  </div>
  <div id="modalBackdrop" class="modal-backdrop" style="display:none"></div>
  <div id="modal" class="modal" style="display:none"></div>
  <div id="toastContainer" class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="icons.js"></script>
  <script src="auth.js"></script>
  <script src="store.js"></script>
  <script src="ai-widget.js"></script>
  <script src="app.js"></script>
</body>
</html>
