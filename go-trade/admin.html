<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c1f" />
    <title>GO TRADE — Admin Center</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <img class="brand-mark" src="assets/logo-icon.png" alt="GO TRADE" />
          <div>
            <strong>GO TRADE</strong>
            <span>ADMIN CENTER</span>
          </div>
        </div>

        <div class="workspace-switcher">
          <div class="avatar avatar-lime" id="sideAvatar">--</div>
          <div class="workspace-copy">
            <strong id="sideName">Admin</strong>
            <span>Administrator</span>
          </div>
        </div>

        <nav class="nav-groups" aria-label="Navigasi admin">
          <div class="nav-label">Overview</div>
          <button class="nav-item active" data-view="overview"><span class="nav-icon" data-icon="home"></span><span>Overview</span></button>
          <div class="nav-label nav-label-spaced">Kelola</div>
          <button class="nav-item" data-view="users"><span class="nav-icon" data-icon="users"></span><span>Manage Users</span></button>
          <button class="nav-item" data-view="deposits"><span class="nav-icon" data-icon="inbox"></span><span>Deposit Requests</span><span class="count-badge" id="depBadge">0</span></button>
          <button class="nav-item" data-view="withdrawals"><span class="nav-icon" data-icon="send"></span><span>Withdrawal Requests</span><span class="count-badge" id="wdBadge">0</span></button>
          <button class="nav-item" data-view="packages"><span class="nav-icon" data-icon="package"></span><span>Manage Packages</span></button>
          <button class="nav-item" data-view="signals"><span class="nav-icon" data-icon="sparkles"></span><span>Manage Signals</span></button>
          <button class="nav-item" data-view="news"><span class="nav-icon" data-icon="megaphone"></span><span>Manage News</span></button>
          <button class="nav-item" data-view="network"><span class="nav-icon" data-icon="share"></span><span>Referral & Network</span></button>
          <div class="nav-label nav-label-spaced">Sistem</div>
          <button class="nav-item" data-view="notify"><span class="nav-icon" data-icon="megaphone"></span><span>Broadcast Notification</span></button>
          <button class="nav-item" data-view="settings"><span class="nav-icon" data-icon="sliders"></span><span>System Settings</span></button>
        </nav>

        <div class="sidebar-footer">
          <div class="profile-card">
            <div class="avatar avatar-orange" id="footAvatar">--</div>
            <div class="profile-copy"><strong id="footName">Admin</strong><span>Admin access</span></div>
          </div>
          <button class="nav-item logout-btn" id="logoutBtn" style="margin-top:6px;color:#ff9b9b"><span class="nav-icon" data-icon="logout"></span><span>Logout</span></button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="mobile-menu" id="mobileMenu" aria-label="Buka menu"><span data-icon="menu" data-icon-size="22"></span></button>
          <div class="breadcrumbs"><span>Admin</span><b>/</b><strong id="breadcrumbCurrent">Overview</strong></div>
          <div class="topbar-actions">
            <div class="theme-toggle"><button data-theme-btn="light" title="Mode terang"><span data-icon="sun" data-icon-size="14"></span></button><button data-theme-btn="dark" title="Mode gelap"><span data-icon="moon" data-icon-size="14"></span></button></div>
            <div class="demo-chip"><span class="status-dot"></span> Demo admin</div>
            <div class="top-avatar" id="topAvatar">--</div>
          </div>
        </header>

        <section class="page" id="app">
          <!-- Views are rendered by admin.js -->
        </section>
      </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <div class="modal" id="modal"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="auth.js"></script>
    <script src="icons.js"></script>
    <script src="store.js"></script>
    <script src="admin.js"></script>
    <script src="ai-widget.js"></script>
  </body>
</html>
