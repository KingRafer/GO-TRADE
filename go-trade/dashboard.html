<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c1f" />
    <title>GO TRADE — Member Workspace</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <img class="brand-mark" src="assets/logo-icon.png" alt="GO TRADE" />
          <div>
            <strong>GO TRADE</strong>
            <span>INTELLIGENT TRADING</span>
          </div>
        </div>

        <div class="workspace-switcher">
          <div class="avatar avatar-lime" id="sideAvatar">--</div>
          <div class="workspace-copy">
            <strong id="sideName">Member</strong>
            <span>Member workspace</span>
          </div>
        </div>

        <nav class="nav-groups" aria-label="Navigasi utama">
          <div class="nav-label">Workspace</div>
          <button class="nav-item active" data-view="dashboard"><span class="nav-icon" data-icon="home"></span><span>Dashboard</span></button>
          <button class="nav-item" data-view="signal"><span class="nav-icon" data-icon="sparkles"></span><span>Signal</span><span class="nav-badge" id="signalBadge">0</span></button>
          <button class="nav-item" data-view="news"><span class="nav-icon" data-icon="megaphone"></span><span>News</span></button>
          <button class="nav-item" data-view="packages"><span class="nav-icon" data-icon="layers"></span><span>Auto Trading</span></button>
          <button class="nav-item" data-view="wallet"><span class="nav-icon" data-icon="wallet"></span><span>Wallet</span></button>
          <button class="nav-item" data-view="deposit"><span class="nav-icon" data-icon="depositIn"></span><span>Deposit</span></button>
          <button class="nav-item" data-view="withdrawal"><span class="nav-icon" data-icon="withdrawOut"></span><span>Withdrawal</span></button>
          <div class="nav-label nav-label-spaced">Growth</div>
          <button class="nav-item" data-view="network"><span class="nav-icon" data-icon="users"></span><span>Network</span></button>
          <button class="nav-item" data-view="bonus"><span class="nav-icon" data-icon="gift"></span><span>Bonus Tracking</span></button>
          <button class="nav-item" data-view="history"><span class="nav-icon" data-icon="history"></span><span>Trade History</span></button>
          <button class="nav-item" data-view="notifications"><span class="nav-icon" data-icon="bell"></span><span>Notifications</span><span class="dot" id="sidebarNotifDot" hidden></span></button>
          <button class="nav-item" data-view="help"><span class="nav-icon" data-icon="help"></span><span>Help Center</span></button>
        </nav>

        <div class="sidebar-footer">
          <button class="nav-item" data-view="settings"><span class="nav-icon" data-icon="settings"></span><span>Account settings</span></button>
          <div class="profile-card">
            <div class="avatar avatar-orange" id="footAvatar">--</div>
            <div class="profile-copy"><strong id="footName">Member</strong><span id="footStatus">Demo mode</span></div>
          </div>
          <button class="nav-item logout-btn" id="logoutBtn" style="margin-top:6px;color:#ff9b9b"><span class="nav-icon" data-icon="logout"></span><span>Logout</span></button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="mobile-menu" id="mobileMenu" aria-label="Buka menu"><span data-icon="menu" data-icon-size="22"></span></button>
          <div class="breadcrumbs"><span>Workspace</span><b>/</b><strong id="breadcrumbCurrent">Dashboard</strong></div>
          <div class="topbar-actions">
            <div class="theme-toggle"><button data-theme-btn="light" title="Mode terang"><span data-icon="sun" data-icon-size="14"></span></button><button data-theme-btn="dark" title="Mode gelap"><span data-icon="moon" data-icon-size="14"></span></button></div>
            <div class="demo-chip"><span class="status-dot"></span> Demo workspace</div>
            <button class="icon-button" id="globalSearchButton" aria-label="Cari"><span data-icon="search" data-icon-size="19"></span></button>
            <button class="icon-button notification-button" data-view="notifications" aria-label="Notifikasi"><span data-icon="bell" data-icon-size="19"></span><span class="notif-dot" id="notifDot" hidden></span></button>
            <div class="top-avatar" id="topAvatar">--</div>
          </div>
        </header>

        <section class="page" id="app">
          <!-- Views are rendered by app.js -->
        </section>
      </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <div class="modal" id="modal"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="auth.js"></script>
    <script src="icons.js"></script>
    <script src="store.js"></script>
    <script src="app.js"></script>
    <script src="ai-widget.js"></script>
  </body>
</html>
