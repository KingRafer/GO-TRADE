<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — GO TRADE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
    .auth-card {
      width:100%; max-width:420px;
      background: var(--bg-card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:36px 32px;
      box-shadow: var(--shadow);
    }
    .auth-card h1 { font-size:24px; margin:16px 0 6px; }
    .auth-card .sub { color:var(--text-secondary); font-size:14px; margin-bottom:28px; }
    .auth-logo { display:flex; align-items:center; gap:10px; }
    .form-group { margin-bottom:16px; }
    .form-group label { display:block; font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:6px; }
    .form-control {
      width:100%; padding:12px 14px; background:var(--bg);
      border:1px solid var(--border); border-radius:8px; font-size:14px; outline:none;
    }
    .form-control:focus { border-color: var(--primary); }
    .error-msg { color:var(--danger); font-size:13px; margin-top:8px; display:none; }
    .demo-hint {
      margin-top:20px; padding:12px 14px; background:rgba(16,185,129,0.08);
      border:1px solid rgba(16,185,129,0.2); border-radius:8px; font-size:12px; color:var(--text-secondary);
    }
    .demo-hint strong { color:var(--primary); }
    .links { margin-top:20px; text-align:center; font-size:13px; color:var(--text-secondary); }
    .links a { color:var(--primary); font-weight:600; }
  </style>
</head>
<body class="dark">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-mark">G</div>
      <div><strong>GO TRADE</strong><span style="display:block;font-size:11px;color:var(--text-muted)">INTELLIGENT TRADING</span></div>
    </div>
    <h1>Masuk Workspace</h1>
    <p class="sub">Login dengan akun GO TRADE Anda</p>

    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input class="form-control" type="email" id="email" placeholder="email@example.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-control" type="password" id="password" placeholder="••••••••" required />
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;width:100%;padding:12px" id="submitBtn">
        Masuk
      </button>
    </form>

    <div class="demo-hint">
      <strong>Demo cepat:</strong><br>
      Member → <code>demo@go-trade.app</code> / <code>demo123</code><br>
      Admin → <code>admin@go-trade.app</code> / <code>admin123</code>
    </div>

    <div class="links">
      Belum punya akun? <a href="register.html">Daftar</a> · <a href="index.html">← Beranda</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initSupabase();
    (async () => {
      const u = await gtRestoreSession();
      if (u) {
        window.location.href = 'index.html?workspace=1&role=' + (u.role || 'member');
      }
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      const err = document.getElementById('errorMsg');
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Memproses...';

      const res = await gtSignIn(email, password);
      if (res.ok) {
        gtPushNotif('Berhasil masuk sebagai ' + res.user.name, 'success');
        window.location.href = 'index.html?workspace=1&role=' + (res.user.role || 'member');
      } else {
        err.textContent = res.error || 'Login gagal';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
