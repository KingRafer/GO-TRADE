<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — GO TRADE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/site.css"/>
  <link rel="icon" href="../assets/logo-icon.png"/>
  <style>
    .member-shell{display:flex;min-height:100vh}
    .side{width:240px;background:var(--bg-elevated);border-right:1px solid var(--border);padding:1.25rem;position:fixed;top:0;bottom:0;left:0}
    .side a{display:block;color:var(--text-muted);text-decoration:none;padding:.6rem .8rem;border-radius:10px;font-size:.875rem;margin-bottom:.25rem}
    .side a:hover,.side a.active{background:rgba(16,185,129,.12);color:var(--cyan)}
    .side .brand{display:flex;align-items:center;gap:.6rem;margin-bottom:1.5rem;font-weight:800}
    .main-area{margin-left:240px;flex:1;padding:1.5rem 2rem}
    .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin:1.25rem 0}
    @media(max-width:900px){.side{display:none}.main-area{margin-left:0}.stat-row{grid-template-columns:1fr 1fr}}
    .stat-box{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.1rem}
    .stat-box .label{font-size:.7rem;color:var(--text-dim);font-weight:700;text-transform:uppercase}
    .stat-box .value{font-size:1.35rem;font-weight:800;margin-top:.25rem}
    .stat-box .value.up{color:var(--green)}
  </style>
</head>
<body>
  <div class="member-shell">
    <aside class="side">
      <div class="brand"><img src="../assets/logo-icon.png" width="32" height="32" style="border-radius:8px"><span>GO TRADE</span></div>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="referral.html">Referral</a>
      <a href="commission.html">Commission</a>
      <a href="profile.html">Profile</a>
      <a href="../index.html">← Landing</a>
      <a href="#" onclick="GTAuth.logout();return false" style="margin-top:2rem;color:#f87171">Logout</a>
    </aside>
    <div class="main-area">
      <h1 style="font-size:1.5rem;font-weight:800">Dashboard</h1>
      <p style="color:var(--text-muted);font-size:.9rem" id="welcome">Selamat datang</p>
      <div class="stat-row">
        <div class="stat-box"><div class="label">Equity</div><div class="value">$12,480</div></div>
        <div class="stat-box"><div class="label">PnL Today</div><div class="value up">+$312</div></div>
        <div class="stat-box"><div class="label">Active Package</div><div class="value">Growth</div></div>
        <div class="stat-box"><div class="label">Signal Acc.</div><div class="value up">87.4%</div></div>
      </div>
      <div class="card" style="margin-top:1rem">
        <h3 style="margin-bottom:.75rem">Quick actions</h3>
        <div style="display:flex;flex-wrap:wrap;gap:.6rem">
          <a class="btn btn-primary" href="referral.html">Lihat Referral</a>
          <a class="btn btn-outline" href="commission.html">Commission</a>
          <a class="btn btn-outline" href="profile.html">Edit Profile</a>
        </div>
      </div>
      <p style="margin-top:2rem;font-size:.8rem;color:var(--text-dim)">Mode demo — angka simulasi. Data real dapat dihubungkan ke Supabase.</p>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const s = GTAuth.requireAuth('member') || GTAuth.getSession();
    if (s) document.getElementById('welcome').textContent = 'Halo, ' + (s.name || s.email);
    // allow admin to also view
    if (!s) { /* redirected */ }
  </script>
</body>
</html>
