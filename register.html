<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registrasi — GO TRADE</title>
  <meta name="theme-color" content="#040810"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
  <link rel="icon" href="assets/logo-icon.png"/>
</head>
<body>
  <button class="theme-toggle-login" id="theme-toggle" aria-label="Theme">☾</button>
  <div class="login-wrap">
    <div class="login-card">
      <a href="index.html" class="login-brand">
        <img src="assets/logo-icon.png" alt="GO TRADE">
        <strong>GO<span>TRADE</span></strong>
      </a>
      <h1>Buat akun baru</h1>
      <p class="sub">Mulai trading dengan AI signals & live chart.</p>
      <form id="registerForm" data-register>
        <div class="form-group">
          <label for="name">Nama</label>
          <input type="text" id="name" name="name" placeholder="Nama lengkap" autocomplete="name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="email@anda.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Minimal 6 karakter" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn-submit">Daftar Sekarang</button>
        <div class="error-msg" id="regError"></div>
      </form>
      <p class="login-footer">Sudah punya akun? <a href="login.html">Login</a></p>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('theme-toggle')?.addEventListener('click', () => {
      const root = document.documentElement;
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('gt-theme', next);
    });
    const stored = localStorage.getItem('gt-theme');
    if (stored) document.documentElement.setAttribute('data-theme', stored);
  </script>
</body>
</html>
